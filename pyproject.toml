[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esim-tool-manager"
version = "0.1.0"
description = "Automated Tool Manager for eSim — FOSSEE Semester Long Internship, Task 5"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "packaging>=24.0",
]

[project.scripts]
esim-tm = "esim_tool_manager.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["esim_tool_manager*"]
